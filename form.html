<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Result Card</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>

<style>
.PT-4{
    margin-top: 20px;
}

</style>

<body>
    <div class="container bg-primary text-light">
        <h2 class="text-center PT-4">
            <i class="fa-solid fa-square-poll-horizontal"></i>
            Student Report Grading System
        </h2>
        <div class="row PT-5">
            <div class="col-sm-6 mt-3">
                <label for="" class="text-center"> Student Name</label>
                <input type="text" class="form-control" />
            </div>

            <div class="col-sm-6 mt-3">
                <label for="" class="text-center"> Roll#</label>
                <input type="number" class="form-control" />
            </div>
            </div>
            
            <hr color="white">
            <h2 class="text-center PT-4">
            STUDENT MARKS 
        </h2>
        <div class="row PT-5">
            <div class="col-sm-6 mt-3">
                <label for="" class="text-center"> IS</label>
                <input type="number" class="form-control" />
            </div>

            <div class="col-sm-6 mt-3">
                <label for="" class="text-center"> FSWD</label>
                <input type="number" class="form-control" />
            </div>


            <div class="col-sm-6 mt-3">
                <label for="" class="text-center"> SE</label>
                <input type="number" class="form-control" />
            </div>


            <div class="col-sm-6 mt-3">
                <label for="" class="text-center"> VP</label>
                <input type="number" class="form-control" />
            </div>
            <div class="col-sm-12 mt-3">
                <a href="" class="btn form-control border border-warning text-light">
                    <i class="fa fa-save" aria-hidden="true"></i> Save
                </a>
                <input type="Submit" value="Submit" class="form-control bg-warning" />
            </div>
        </div>
    </div>
</body>

</html>
